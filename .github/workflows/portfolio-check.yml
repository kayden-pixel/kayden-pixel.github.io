name: Portfolio checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify-static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check assets/experience.js
          node --check assets/studio-v3.js
      - name: Run zero-dependency portfolio checks
        run: node --test test/portfolio.test.js
